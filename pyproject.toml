[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  "display/waveshare",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"
root = ["."]

[tool.ty.src]
include = ["display"]
