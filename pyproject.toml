[project]
name = "glados"
version = "0.1.0"
description = "GLaDOS-inspired physical voice assistant head"
requires-python = ">=3.13"
dependencies = [
  "Pillow>=11,<13",
  "numpy>=2,<3",
  "websockets>=15,<16",
]

[dependency-groups]
dev = [
  "ruff>=0.13,<0.14",
  "ty>=0.0.1,<0.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  "display/waveshare",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"
root = ["."]

[tool.ty.src]
include = ["display"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
